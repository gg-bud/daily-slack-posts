name: Daily Slack Post (Secondary)

on:
  schedule:
    # 9:00 AM Eastern = 13:00 UTC
    - cron: "30 10 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily post
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SECONDARY_SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SECONDARY_SLACK_CHANNEL_ID }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: python daily_slack_post.py
