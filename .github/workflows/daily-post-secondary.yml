name: Daily Slack Post (Secondary)

on:
  # Schedule disabled — all posts to Exohard turned off
  # schedule:
  #   # 8:30 AM Eastern = 12:30 UTC
  #   - cron: "30 12 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify required secrets
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SECONDARY_SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SECONDARY_SLACK_CHANNEL_ID }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: |
          missing=0
          for name in SLACK_BOT_TOKEN SLACK_CHANNEL_ID NASA_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret for workflow 'Daily Slack Post (Secondary)'. Check SECONDARY_SLACK_BOT_TOKEN, SECONDARY_SLACK_CHANNEL_ID, and NASA_API_KEY at Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi
          echo "All required secrets are present."

      - name: Run daily post
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SECONDARY_SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SECONDARY_SLACK_CHANNEL_ID }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          DISABLE_WIKIQUOTE: "true"
        run: python daily_slack_post.py
